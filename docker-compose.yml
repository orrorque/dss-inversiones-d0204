services:
  dss-api:
    build: .
    container_name: dss-api
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn api:api --host 0.0.0.0 --port 8501
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/salud', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dss-streamlit:
    build: .
    container_name: dss-streamlit
    ports:
      - "8502:8502"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    environment:
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_HEADLESS=true
      - PYTHONUNBUFFERED=1
    depends_on:
      dss-api:
        condition: service_healthy
    command: streamlit run app.py --server.port=8502 --server.headless=true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8502), 5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
